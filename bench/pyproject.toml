[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tulip-rs-bench"
version = "0.1.0"
description = "Python benchmark suite — tulip-rs Python binding vs pandas-ta"
requires-python = ">=3.9"
dependencies = [
    "tulip-rs>=0.1.13",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "ta>=0.11.0",
    "pandas-ta>=0.3.14b0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
tulip-rs-bench = "tulip_rs_bench.run_all:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tulip_rs_bench*"]
